[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-calibration-benchmark"
version = "0.1.0"
description = "Leakage-resistant benchmarking of calibration burden in motor-imagery EEG BCIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "James Li" }
]
keywords = [
  "brain-computer interface",
  "BCI",
  "EEG",
  "motor imagery",
  "calibration",
  "MOABB",
  "reproducibility",
  "neuroAI"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.6,<2",
  "mne>=1.10,<2",
  "moabb==1.5.0",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.9,<4",
  "statsmodels>=0.14,<1"
]

[project.optional-dependencies]
deep = [
  "torch>=2.5,<3",
  "braindecode==1.7.0"
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "build>=1.2,<2"
]

[project.scripts]
bci-calibration = "bci_calibration_benchmark.cli:main"

[project.urls]
Homepage = "https://omicsai.org"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires optional external scientific packages",
  "download: downloads a public EEG dataset",
  "slow: computationally expensive test"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["bci_calibration_benchmark"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
