experiment:
  name: bci-calibration-full-v1
  seed: 20260811
  output_root: results
  processed_root: data/processed
  cache_root: data/moabb-cache
  continue_on_error: false

preprocessing:
  # Common post-cue motor-imagery window. Starting at 0.5 s reduces
  # class-specific visual-cue transients; ending at 3.5 s remains within the
  # labeled 4 s imagery interval of every confirmatory dataset.
  fmin: 8.0
  fmax: 30.0
  tmin: 0.5
  tmax: 3.5
  resample: 128.0
  channels: null
  dtype: float32

datasets:
  # Lee2019_MI is instantiated with train_run=True and test_run=False in the
  # adapter registry, retaining only labeled offline trials in both sessions.
  - name: Lee2019_MI
    subjects: all
    exclude_subjects: []
  - name: BNCI2014_001
    subjects: all
    exclude_subjects: []
  - name: Zhou2016
    subjects: all
    # Subject 2 is structurally ineligible: their publicly released
    # session-1/run-1 recording contains only 20 trials/class instead of the
    # protocol's 25/run, discovered by pre-outcome structural validation
    # (not performance). See docs/DECISIONS.md ("Zhou2016 subject 2
    # structural exclusion") and docs/debugging_log.md, section 4.
    exclude_subjects: [2]

split:
  # Fixed prospective evaluation: all earlier target sessions form the
  # calibration pool; the chronologically latest session is never touched
  # until final scoring.
  policy: latest_session_only
  test_fraction: 0.30
  repeats: 10
  allow_trial_level_fallback: false
  minimum_test_per_class: 10
  minimum_calibration_per_class: 40

calibration:
  # Per class. The largest point therefore corresponds to 80 labeled target
  # trials in total and is available by design in every confirmatory dataset.
  budgets_per_class: [0, 5, 10, 20, 40]
  insufficient_budget: error
  nested: true

source:
  max_subjects: 10
  # Equalize source-participant influence and cap compute. Sampling is
  # class-balanced and deterministic for each source-target pair.
  max_trials_per_class_per_subject: 20
  balance_classes_within_subject: true

methods:
  - logvar_lda
  - csp_lda
  - riemann_lr

metrics:
  primary: roc_auc
  secondary:
    - balanced_accuracy
    - accuracy
    - macro_f1
    - brier
    - log_loss

classical:
  csp_components: 8
  csp_reg: ledoit_wolf
  logistic_c: 1.0
  tangent_mean_max_iter: 50
  tangent_mean_tol: 1.0e-9

analysis:
  bootstrap_resamples: 2000
  ci_level: 0.95
  pairwise_budgets: [5, 10]
  aucc_max_budget_per_class: 40
  roc_auc_threshold: 0.75
  balanced_accuracy_threshold: 0.70
  fit_mixed_effects: true

runtime:
  n_jobs_data: 1
  overwrite_processed: false
  resume: true
  save_predictions: true
