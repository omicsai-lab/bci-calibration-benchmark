# Sensitivity analysis only. It tests whether conclusions persist under the
# common low-density motor-cortex montage available in all three datasets.
experiment:
  name: bci-calibration-three-channels
  seed: 20260811
  output_root: results
  processed_root: data/processed
  cache_root: data/moabb-cache
  continue_on_error: false

preprocessing:
  fmin: 8.0
  fmax: 30.0
  tmin: 0.5
  tmax: 3.5
  resample: 128.0
  channels: [C3, Cz, C4]
  dtype: float32

datasets:
  - name: Lee2019_MI
    subjects: all
    exclude_subjects: []
  - name: BNCI2014_001
    subjects: all
    exclude_subjects: []
  - name: Zhou2016
    subjects: all
    # Subjects 2 and 4 are structurally ineligible: each has one publicly
    # released session/run with only 20 trials/class instead of the
    # protocol's 25/run (subject 2: session 1, run 1; subject 4: session 0,
    # run 0), discovered by pre-outcome structural validation (not
    # performance) and verified directly against raw BIDS event counts. See
    # docs/DECISIONS.md ("Zhou2016 subject 2 structural exclusion" and
    # "Zhou2016 subject 4 structural exclusion") and docs/debugging_log.md.
    exclude_subjects: [2, 4]

split:
  policy: latest_session_only
  test_fraction: 0.30
  repeats: 10
  allow_trial_level_fallback: false
  minimum_test_per_class: 10
  minimum_calibration_per_class: 40

calibration:
  budgets_per_class: [0, 5, 10, 20, 40]
  insufficient_budget: error
  nested: true

source:
  max_subjects: 10
  max_trials_per_class_per_subject: 20
  balance_classes_within_subject: true

methods: [logvar_lda, csp_lda, riemann_lr]
metrics:
  primary: roc_auc
  secondary: [balanced_accuracy, accuracy, macro_f1, brier, log_loss]
classical:
  csp_components: 3
  csp_reg: ledoit_wolf
  logistic_c: 1.0
  tangent_mean_max_iter: 50
  tangent_mean_tol: 1.0e-9
analysis:
  bootstrap_resamples: 2000
  ci_level: 0.95
  pairwise_budgets: [5, 10]
  aucc_max_budget_per_class: 40
  roc_auc_threshold: 0.75
  balanced_accuracy_threshold: 0.70
  fit_mixed_effects: true

runtime:
  n_jobs_data: 1
  overwrite_processed: false
  resume: true
  save_predictions: true
